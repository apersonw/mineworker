name: Release

# 两条路：
#   1. 打 tag v0.4.0  → 正式 PyPI + GitHub Release（tag 必须与 __about__.py 一致）
#   2. 手动触发        → 默认发 TestPyPI，用来演练整条 OIDC 链路，不用改版本号
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: 发到哪个索引
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      target: ${{ steps.meta.outputs.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 确定版本与目标索引
        id: meta
        run: |
          pkg=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('mineworker/__about__.py').read_text()).group(1))")

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # tag 触发：包版本以 __about__.py 为准，tag 必须对得上，否则发出去的
            # 产物版本和 tag 名不一致，事后无从追溯
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag  __about__=$pkg"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag ($tag) 与 __about__.py ($pkg) 不一致，拒绝发布"
              exit 1
            fi
            # rc / a / b 结尾的预发布只进 TestPyPI
            if [[ "$tag" =~ (a|b|rc)[0-9]+$ ]]; then
              target=testpypi
            else
              target=pypi
            fi
          else
            target="${{ inputs.target }}"
            echo "手动触发：版本 $pkg → $target"
          fi

          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - name: 干净环境冒烟
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "dist/mineworker-${{ steps.meta.outputs.version }}-py3-none-any.whl[cli]"
          /tmp/smoke/bin/python -c "import mineworker; print(mineworker.__version__)"
          /tmp/smoke/bin/mineworker --version

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  # 演练用：手动触发或 rc/a/b 预发布 → TestPyPI，验证整条 OIDC 链路
  testpypi:
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing 用，不需要任何 token
    steps:
      - uses: actions/download-artifact@v6
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # 正式版 → PyPI
  pypi:
    needs: build
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi # 在仓库 Settings 里给这个 environment 加人工审批
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  # 只有 tag 触发的正式发布才建 GitHub Release（手动触发没有 tag 可挂）
  github-release:
    needs: [build, pypi]
    if: needs.build.outputs.target == 'pypi' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with: { name: dist, path: dist }

      - name: 从 CHANGELOG 抽取本版本段落
        run: |
          python - <<'PY' > notes.md
          import pathlib, re
          v = "${{ needs.build.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(v)}\].*?$(.*?)(?=^## )", text, re.S | re.M)
          print(m.group(1).strip() if m else f"见 CHANGELOG.md 的 {v} 段落。")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
