name: Release

# 打 tag 即发布：v0.4.0 → 正式 PyPI，v0.4.0rc1 / v0.4.0b1 → TestPyPI（先演练）
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 校验 tag 与 __about__.py 一致
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('mineworker/__about__.py').read_text()).group(1))")
          echo "tag=$tag  __about__=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ($tag) 与 __about__.py ($pkg) 不一致，拒绝发布"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # rc / a / b 结尾视为预发布 → 只发 TestPyPI
          if [[ "$tag" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - name: 干净环境冒烟
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "dist/mineworker-${{ steps.meta.outputs.version }}-py3-none-any.whl[cli]"
          /tmp/smoke/bin/python -c "import mineworker; print(mineworker.__version__)"
          /tmp/smoke/bin/mineworker --version

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  # 预发布（v*rc1 等）→ TestPyPI，用来验证整条 OIDC 链路
  testpypi:
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing 用，不需要任何 token
    steps:
      - uses: actions/download-artifact@v6
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # 正式版 → PyPI
  pypi:
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi # 在仓库 Settings 里给这个 environment 加人工审批
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, pypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with: { name: dist, path: dist }

      - name: 从 CHANGELOG 抽取本版本段落
        run: |
          python - <<'PY' > notes.md
          import pathlib, re
          v = "${{ needs.build.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(v)}\].*?$(.*?)(?=^## )", text, re.S | re.M)
          print(m.group(1).strip() if m else f"见 CHANGELOG.md 的 {v} 段落。")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
