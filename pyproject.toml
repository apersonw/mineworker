[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineworker"
dynamic = ["version"]
description = "一个上手简单、结构清晰的 Python 爬虫框架（对标 feapder）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas", email = "schummshelly26@gmail.com" }]
keywords = ["crawler", "spider", "scraping", "feapder", "爬虫"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "parsel>=1.9",
    "w3lib>=2.1",
    "loguru>=0.7",
    "bitarray>=2.9",
]

[project.urls]
Homepage = "https://github.com/apersonw/mineworker"
Repository = "https://github.com/apersonw/mineworker"
Documentation = "https://apersonw.github.io/mineworker/"
Changelog = "https://github.com/apersonw/mineworker/blob/main/CHANGELOG.md"
Issues = "https://github.com/apersonw/mineworker/issues"

[project.optional-dependencies]
render = ["playwright>=1.44"]
mongo = ["pymongo>=4.7"]
mysql = ["pymysql>=1.1", "dbutils>=3.0"]
redis = ["redis>=5.0"]
cli = ["typer>=0.12", "jinja2>=3.1"]
metrics = ["prometheus-client>=0.20"]
curl = ["curl_cffi>=0.16"]  # TLS / HTTP2 指纹伪装
all = ["mineworker[render,mongo,mysql,redis,cli,metrics,curl]"]
dev = [
    "mineworker[all]",
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "pytest-httpserver>=1.0",
    "mongomock>=4.1",
    "fakeredis>=2.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
# 指向 commands/__init__ 的轻量守卫：没装 [cli] extra 时给提示而不是 ModuleNotFoundError
mineworker = "mineworker.commands:main"

[tool.hatch.version]
path = "mineworker/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["mineworker"]

[tool.hatch.build.targets.sdist]
include = [
    "/mineworker",
    "/tests",
    "/docs",
    "/mkdocs.yml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["mineworker", "tests"]
extend-exclude = ["docs", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
# RUF001-003: 中文全角标点被判定为「易混淆字符」，本项目注释大量使用中文，需忽略
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试里频繁定义局部爬虫子类，__custom_setting__ 用普通 dict 更自然
"tests/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["mineworker"]

# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
files = ["mineworker"]
pretty = true

[[tool.mypy.overrides]]
module = [
    "parsel.*",
    "bitarray.*",
    "w3lib.*",
    "bs4.*",
    "IPython.*",
    "pymysql.*",
    "dbutils.*",
    "curl_cffi.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "render: 需要 Playwright + chromium（playwright install chromium）",
    "network: 需要访问外部网络（指纹验证等），CI 里用 -m 'not network' 排除",
]

[tool.coverage.run]
source = ["mineworker"]
branch = true
