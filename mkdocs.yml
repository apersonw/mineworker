site_name: MineWorker
site_description: 一个上手简单、结构清晰的 Python 爬虫框架
repo_url: https://github.com/Lucas/mineworker
docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: 切换到暗色 }
    - scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: 切换到亮色 }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 编写爬虫: spider.md
  - 分布式: distributed.md
  - 数据与去重: item-pipeline.md
  - 浏览器渲染: render.md
  - 中间件与代理: middleware-proxy.md
  - 账号 / Cookie 池: user-pool.md
  - async 内核评估: async-kernel.md
  - 监控与调试: observability.md
  - 命令行: cli.md
  - 配置项: settings.md
  - API: api.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - toc: { permalink: true }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source
