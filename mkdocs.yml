site_name: MineWorker
site_description: 一个上手简单、结构清晰的 Python 爬虫框架
site_url: https://apersonw.github.io/mineworker/
repo_url: https://github.com/apersonw/mineworker
repo_name: apersonw/mineworker
docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: 切换到暗色 }
    - scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: 切换到亮色 }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 编写爬虫: spider.md
  - 分布式: distributed.md
  - 批次采集: batch-spider.md
  - 数据与去重: item-pipeline.md
  - 浏览器渲染: render.md
  - 中间件与代理: middleware-proxy.md
  - 反爬对抗: anti-bot.md
  - 账号 / Cookie 池: user-pool.md
  - async 内核评估: async-kernel.md
  - 监控与调试: observability.md
  - 命令行: cli.md
  - 配置项: settings.md
  - API: api.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  # 默认 slugify 会把中文标题整段丢掉（锚点退化成 _1 / _2，没法深链），
  # 换成 pymdownx 的 unicode slugify 才能用「#何时重新评估」这种锚点
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source
